<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
 <div class="container mt-5">
  <div class="row">
    <div class="col-md-5 mx-auto">
      <div class="card card-body shadow-sm">
        
        <div id="login-box">
          <h2 class="mb-3">Log in</h2>
          <div id="login-message"></div>
          <form id="login-form">
            <div class="mb-3">
              <input type="text" id="login-username" class="form-control" placeholder="Username" required>
            </div>
            <div class="mb-3">
              <input type="password" id="login-password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Log in</button>
          </form>
        </div>

        <div id="register-box" class="d-none">
          <h2 class="mb-3">Register User</h2>
          <div id="register-message"></div>
          <form id="register-form">
            <div class="mb-3">
              <input type="text" id="register-username" class="form-control" placeholder="Choose a username" required>
            </div>
            <div class="mb-3">
              <input type="password" id="register-password" class="form-control" placeholder="Choose a password" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Register</button>
          </form>
        </div>

        <div class="text-center mt-3">
          <a href="#" id="toggle-auth-view" class="text-decoration-none">Don't have an account? Register here!</a>
        </div>

      </div>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/functions.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
