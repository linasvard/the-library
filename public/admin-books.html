<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Books</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="init-header"></div>
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mt-4">
      <h1 class="title mt-5">Hello <span class="sub-title">Admin.</span></h1>
      <a href="books.html" class="btn back-btn btn-outline-secondary mt-2">&larr; Back to books</a>
    </div>

    <article>
      <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Veritatis nostrum magnam dolorum rem odio libero doloremque obcaecati non repellat quia ratione in ipsum suscipit natus delectus quo eius, architecto tenetur.</p>
    </article>

    <h2 class="mt-5">Create <span class="sub-title-2">Book</span></h2>
    <form id="create-book-form" class="mt-3">
      <input type="hidden" id="book-edit-id" value="">
      <div class="mb-3">
        <input type="text" class="form-control" id="book-title" placeholder="Title" required>
      </div>
      <div class="mb-3">
        <textarea class="form-control" id="book-description" placeholder="Description" required></textarea>
      </div>
      <div class="mb-3">
        <input type="text" class="form-control" id="book-author" placeholder="Author" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Genres</label>
        <div class="dropdown">
          <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="genre-dropdown-btn" data-bs-toggle="dropdown" aria-expanded="false">
            Select genres
          </button>
          <ul class="dropdown-menu p-2" id="genre-dropdown-menu" style="max-height: 250px; overflow-y: auto;">
            <!-- Kryssrutor genereras med JS -->
          </ul>
        </div>
      </div>
      <div class="mb-3">
        <input type="text" class="form-control" id="book-image" placeholder="Image URL">
      </div>
      <div class="mb-3">
        <input type="number" class="form-control" id="book-published-year" placeholder="Published Year" required>
      </div>
      <p id="create-message" class="mt-3"></p>
      <button type="submit" class="btn btn-primary">Create</button>
    </form>

    <h2 class="mt-5">All <span class="sub-title-2">books</span></h2>
    <div id="admin-book-list" class="row mt-4"></div>

    
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/functions.js"></script>
  <script src="js/adminBooks.js"></script>
  <script src="js/navbarFooter.js"></script>
</body>
</html>
