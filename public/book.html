<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="init-header"></div>
    <div class="container px-5">
        
        <div id="book-detail" class="row mt-4 g-5 book-container"></div>

        <hr class="my-5 border-0" />

        <h2>Reviews</h2>
        <div id="review-list" class="mt-3"></div>

        <hr class="my-5 border-0" />
    
        <h2>Leave a Review</h2>
        <form id="review-form" class="mt-3">
          <div class="mb-3">
            <label for="review-name" class="form-label">Name</label>
            <input type="text" class="form-control" id="review-name" required>
          </div>

          <div class="mb-3">
            <label for="review-content" class="form-label">Review</label>
            <textarea class="form-control" id="review-content" rows="3" required></textarea>
          </div>

          <div class="mb-3">
            <label for="review-rating" class="form-label">Rating</label>
            <select class="form-select" id="review-rating" required>
                <option value="">Choose a rating</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary submit-btn">Submit Review</button>
        </form>

      </div>
      <div id="init-footer"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
    <script src="js/functions.js"></script>
    <script src="js/book.js"></script>
    <script src="js/reviewForm.js"></script>
    <script src="js/navbarFooter.js"></script>
  </body>
</html>
